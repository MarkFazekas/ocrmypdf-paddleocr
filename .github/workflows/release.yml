name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (for example 0.2.0 or 0.2.0rc1)"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: true
        default: false
        type: boolean
      publish_pypi:
        description: "Publish the built package to PyPI"
        required: true
        default: true
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from the main branch in the Actions 'Run workflow' branch selector."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - id: version
        name: Validate version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::Version must look like 0.2.0 or 0.2.0rc1"
            exit 1
          fi
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run lightweight tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ocrmypdf>=17,<18" "Pillow>=10" pytest
          python -m pip install -e . --no-deps
          pytest -q

  build:
    name: Tag and build
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create or verify release tag
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          git fetch --force --tags origin

          if git show-ref --tags --verify --quiet "refs/tags/${TAG}"; then
            EXISTING_COMMIT="$(git rev-parse "${TAG}^{}")"
            if [[ "${EXISTING_COMMIT}" != "${GITHUB_SHA}" ]]; then
              echo "::error::Tag ${TAG} already exists on ${EXISTING_COMMIT}, not this main commit (${GITHUB_SHA})."
              exit 1
            fi
            echo "Tag ${TAG} already points at this commit; reusing it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip build twine
          rm -rf dist/
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          names = [p.name for p in pathlib.Path("dist").iterdir()]
          normalized = version.replace("-", "_")
          if not any(re.search(rf"-{re.escape(normalized)}(?:-|\.)", name) for name in names):
              raise SystemExit(
                  f"Built artifacts do not contain requested version {version}: {names}"
              )
          print("Built:", *names, sep="\n  ")
          PY
        env:
          VERSION: ${{ inputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: ${{ inputs.publish_pypi }}
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ocrmypdf-paddleocr-plus
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    name: Create GitHub Release
    needs: [validate, build, publish-pypi]
    if: >-
      ${{ always() &&
          needs.validate.result == 'success' &&
          needs.build.result == 'success' &&
          (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists; uploading artifacts."
            gh release upload "${TAG}" dist/*               --repo "${GITHUB_REPOSITORY}"               --clobber
          else
            args=(
              release create "${TAG}"
              dist/*
              --repo "${GITHUB_REPOSITORY}"
              --title "${TAG}"
              --generate-notes
              --verify-tag
            )
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh "${args[@]}"
          fi
